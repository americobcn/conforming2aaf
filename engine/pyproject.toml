[project]
name = "conform2aaf"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyaaf2==1.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conform2aaf = "conform2aaf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conform2aaf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
